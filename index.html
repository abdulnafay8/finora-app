    <script>
      // The on-device database needs a cross-origin isolated page. Hosts that
      // cannot send the headers (GitHub Pages) get them from the service
      // worker, which only controls the page after the first load: reload
      // once when it takes over. The app waits for this before opening its
      // database (src/lib/web-app.ts). `npm run build:web` fills in the base path.
      (function () {
        var flag = 'finora-isolation-reload';
        if (window.crossOriginIsolated) {
          try {
            sessionStorage.removeItem(flag);
          } catch (e) {}
          return;
        }
        if (!window.isSecureContext || !('serviceWorker' in navigator)) return;
        try {
          // Already reloaded once and still not isolated: the browser cannot do it.
          if (sessionStorage.getItem(flag)) return;
        } catch (e) {
          return;
        }
        var base = '/finora-app';
        if (base.charAt(0) === '%') base = '';
        window.__FINORA_AWAITING_ISOLATION__ = true;
        var reload = function () {
          try {
            sessionStorage.setItem(flag, '1');
          } catch (e) {}
          window.location.reload();
        };
        navigator.serviceWorker
          .register(base + '/sw.js', { scope: base + '/' })
          .then(function () {
            if (navigator.serviceWorker.controller) reload();
            else navigator.serviceWorker.addEventListener('controllerchange', reload);
          })
          .catch(function () {
            window.__FINORA_AWAITING_ISOLATION__ = false;
          });
      })();
    </script>
